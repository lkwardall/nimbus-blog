
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your trusted source for evidence-based insights on longevity, hormone health, and proactive wellness. Explore articles on diet, exercise, technology, and more." />
    <title>Discover Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "marked": "https://cdn.jsdelivr.net/npm/marked@13.0.1/lib/marked.esm.js"
  }
}
</script>
<style>
  /* Core Layout Reset */
  html {
    -webkit-text-size-adjust: 100%;
    /* Removed height: 100% to prevent clipping */
  }
  body {
    background-color: #010202; /* Match app background */
    margin: 0;
    padding: 0;
    min-height: 100vh; /* Ensure full height */
    width: 100%;
    position: relative;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden; /* Prevent horizontal scroll */
  }
  #root {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Styles for dynamically generated article content */
  .article-content {
      color: #d1d5db; /* gray-300 */
      font-size: 1.125rem; /* 18px */
      line-height: 1.75;
      /* Safety constraints for mobile layout */
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
      max-width: 100%;
  }
  .article-content > *:first-child {
      margin-top: 0;
  }
  .article-content h2 {
    color: white;
    font-size: 2rem; /* 32px */
    line-height: 2.25rem; /* 36px */
    font-weight: 700;
    border-bottom: 1px solid #308271;
    padding-bottom: 0.5rem;
    margin-top: 2.5em;
    margin-bottom: 1.25em;
    scroll-margin-top: 196px; /* Offset for sticky header + subheader */
  }
  .article-content h3 {
    color: #e5e7eb; /* gray-200 */
    font-size: 1.75rem; /* 28px */
    line-height: 2rem; /* 32px */
    font-weight: 600;
    margin-top: 2em;
    margin-bottom: 1em;
    scroll-margin-top: 196px; /* Offset for sticky header + subheader */
  }
  .article-content p {
      margin-top: 1.5em;
      margin-bottom: 1.5em;
  }
  .article-content a {
    color: #308271;
    text-decoration: underline;
    transition: color 0.2s ease-in-out;
    word-break: break-all; /* Prevent long URLs from breaking layout */
  }
  .article-content a:hover {
      color: #45a08d;
  }
  .article-content ul, .article-content ol {
      margin-top: 1.5em;
      margin-bottom: 1.5em;
      padding-left: 2em;
  }
  .article-content ul {
      list-style-type: disc;
  }
  .article-content ol {
      list-style-type: decimal;
  }
  .article-content li {
      margin-top: 0.5em;
      margin-bottom: 0.5em;
  }
  .article-content blockquote {
      color: #d1d5db;
      border-left: 4px solid #308271;
      padding-left: 1.25em;
      margin-top: 1.5em;
      margin-bottom: 1.5em;
      font-style: italic;
  }
  .article-content strong {
      color: #fff;
      font-weight: 600;
  }
  .article-content code {
      color: #e5e7eb;
      background-color: #0f323e;
      padding: 0.2em 0.4em;
      border-radius: 6px;
      font-size: 0.9em;
      border: 1px solid #215b69;
      white-space: pre-wrap; /* Allow code to wrap */
  }
  .article-content img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
  }
  .article-content pre {
      overflow-x: auto;
      max-width: 100%;
      background-color: #0f323e;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 1.5em;
      margin-bottom: 1.5em;
  }

  /* Nimbus Embedded Ad Styles */
  .article-ad-card {
    display: flex;
    flex-direction: column;
    background-color: #000000;
    border: 1px solid #1f2937; /* gray-800 */
    border-radius: 1rem; /* 16px */
    overflow: hidden;
    margin: 3rem 0;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    position: relative;
  }

  /* Subtle inner border effect */
  .article-ad-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 1rem;
    padding: 1px;
    background: linear-gradient(45deg, transparent, rgba(48, 130, 113, 0.3), transparent); 
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.6;
    pointer-events: none;
  }

  .article-ad-card:hover {
    border-color: #308271;
    box-shadow: 0 25px 50px -12px rgba(48, 130, 113, 0.25); /* Teal glow */
    transform: translateY(-4px);
  }

  .article-ad-image-wrapper {
    width: 100%;
    height: 240px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }

  /* Gradient overlay to fade image into black background */
  .article-ad-image-wrapper::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 0%, transparent 40%, #000000 100%);
    pointer-events: none;
    z-index: 10;
  }

  .article-ad-image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background-color: #000;
    transition: transform 0.7s ease;
  }

  .article-ad-card:hover .article-ad-image-wrapper img {
    transform: scale(1.08);
  }

  .article-ad-content-wrapper {
    padding: 2rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    justify-content: center;
    position: relative;
    z-index: 20;
  }

  @media (min-width: 768px) {
    .article-ad-card {
      flex-direction: row;
      align-items: stretch;
    }
    
    .article-ad-image-wrapper {
      width: 40%;
      height: auto;
      min-height: 250px;
    }

    /* Change gradient direction for horizontal layout */
    .article-ad-image-wrapper::after {
        background: linear-gradient(to right, transparent 0%, transparent 50%, #000000 100%);
    }
    
    .article-ad-content-wrapper {
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      width: 60%;
      padding: 2rem 3rem;
    }

    .article-ad-text-content {
      flex: 0 0 auto;
      margin-right: 0;
      margin-bottom: 2rem;
      width: 100%;
    }
  }

  .article-ad-tag {
    color: #308271;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.75rem;
    margin-bottom: 0.75rem;
    display: block;
    opacity: 0.9;
  }

  .article-ad-title {
    color: white;
    font-weight: 800;
    font-size: 1.75rem;
    margin-bottom: 0.75rem;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  .article-ad-text {
    color: #9ca3af; /* gray-400 */
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 2rem;
    font-weight: 400;
  }

  @media (min-width: 768px) {
      .article-ad-text {
          margin-bottom: 0;
      }
  }

  .article-ad-button {
    background: linear-gradient(135deg, #308271 0%, #1e4f45 100%);
    color: white !important;
    font-weight: 700;
    padding: 0.875rem 2.25rem;
    border-radius: 9999px;
    text-decoration: none !important;
    transition: all 0.3s ease;
    white-space: nowrap;
    display: inline-block;
    text-align: center;
    align-self: flex-start;
    box-shadow: 0 4px 12px rgba(48, 130, 113, 0.3);
    text-transform: uppercase;
    font-size: 0.875rem;
    letter-spacing: 0.05em;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  @media (min-width: 768px) {
    .article-ad-button {
       align-self: flex-start;
    }
  }

  .article-ad-button:hover {
    background: linear-gradient(135deg, #45a08d 0%, #308271 100%);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(48, 130, 113, 0.5);
    border-color: rgba(255,255,255,0.3);
  }
</style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
